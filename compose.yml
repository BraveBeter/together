services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: https://${DOMAIN:?Set DOMAIN in .env}
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      ENABLE_DEMO_LOGIN: "false"
    volumes:
      - ${HOST_DATA_DIR:-./data}:/app/data
      - ${HOST_BACKUP_DIR:-./backups}:/app/backups
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
